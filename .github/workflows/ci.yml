name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schema and examples
        run: python scripts/validate_examples.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v


      - name: Verify wheel in an isolated consumer environment
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/schema-wheels" .
          python -m venv "${RUNNER_TEMP}/schema-consumer"
          "${RUNNER_TEMP}/schema-consumer/bin/python" -m pip install "${RUNNER_TEMP}/schema-wheels/"*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/schema-consumer/bin/python" "${GITHUB_WORKSPACE}/scripts/verify_installed_package.py"

      - name: Write job summary
        run: |
          printf '%s\n' \
            '## mandate-schema' \
            '' \
            '✓ Draft 2020-12 schema validation' \
            '✓ Valid examples accepted' \
            '✓ Intended invalid examples rejected' \
            '✓ Lifecycle semantic checks' \
            >> "$GITHUB_STEP_SUMMARY"
